<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8f9fa;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 48px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      margin-bottom: 12px;
    }

    .btn-primary:hover { background: #1d4ed8; }

    .btn-secondary {
      background: #ffffff;
      color: #374151;
      border: 1px solid #e5e7eb;
    }

    .btn-secondary:hover { background: #f9fafb; }

    .divider {
      margin: 24px 0;
      display: flex;
      align-items: center;
      color: #9ca3af;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .divider span {
      padding: 0 16px;
    }

    .features {
      text-align: left;
      margin-top: 24px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #6b7280;
    }

    .feature-icon {
      width: 20px;
      height: 20px;
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Life Log</h1>
    </div>
    <p class="tagline">Record the moments that matter</p>

    <a href="signin.html" class="btn btn-primary">Sign In</a>
    <a href="signup.html" class="btn btn-secondary">Create Account</a>

    <div class="divider"><span>or</span></div>

    <a href="forgot-password.html" class="btn btn-secondary">Forgot Password?</a>

    <div class="features">
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Secure & private</span>
      </div>
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Track your daily moments</span>
      </div>
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Access anywhere</span>
      </div>
    </div>
  </div>
</body>
</html>
